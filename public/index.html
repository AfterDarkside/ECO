<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket Vital - Sistema de Gestión</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2e7d32; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #2e7d32; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background-color: #1b5e20; }
        #resultados { margin-top: 20px; background: #e8f5e9; padding: 15px; border-radius: 4px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>EcoMarket Vital</h1>
    <div id="login-section">
        <h3>Iniciar Sesión (Seguridad RBAC / Login)</h3>
        <div class="form-group">
            <label>Correo Electrónico:</label>
            <input type="email" id="correo" placeholder="admin@ecomarket.com">
        </div>
        <div class="form-group">
            <label>Contraseña:</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button onclick="login()">Ingresar al Sistema</button>
    </div>

    <div id="dashboard-section" style="display:none;">
        <h3>Panel de Control y Reportes SQL</h3>
        <p>¡Bienvenido al sistema! Aquí puedes probar las consultas de la base de datos:</p>
        <button onclick="cargarInventarioBajo()">Cargar Consulta: Inventario Bajo</button>
        <div id="resultados">
            <h4>Resultados:</h4>
            <pre id="data-output">Cargando...</pre>
        </div>
    </div>
</div>

<script>
    function login() {
        const correo = document.getElementById('correo').value;
        if(correo) {
            document.getElementById('login-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
        } else {
            alert('Por favor ingresa un correo');
        }
    }

    async function cargarInventarioBajo() {
        document.getElementById('resultados').style.display = 'block';
        try {
            const response = await fetch('/api/inventario-bajo');
            const data = await response.json();
            document.getElementById('data-output').textContent = JSON.stringify(data, null, 2);
        } catch (error) {
            document.getElementById('data-output').textContent = 'Error al conectar con la base de datos de Render.';
        }
    }
</script>

</body>
</html>
